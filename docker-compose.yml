services:
  supabase-db:
    image: postgres:15
    networks: [internal]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  server:
    build: ./server
    networks: [internal]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      REDIS_URL: redis://redis:6379
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
  redis:
    image: redis:7-alpine
    networks: [internal]
  nginx:
    image: nginx:alpine
    ports: ['443:443']
    networks: [internal]
    volumes: [./infra/nginx.conf:/etc/nginx/nginx.conf:ro]
networks:
  internal: {}
volumes:
  pgdata: {}
